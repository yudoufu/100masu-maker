<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f3">
  <meta name="description" content="たし算・ひき算・かけ算の100ます計算プリントを無料で作成。印刷してすぐ使えます。">
  <title>100ます計算プリントメーカー</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brandmark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" />
            <path d="M8 8h2m4 0h2M8 12h2m4 0h2M8 16h2m4 0h2" />
          </svg>
        </span>
        まいにち100ます
      </div>
      <div class="top-note">つくって、印刷して、毎日の学習に。</div>
    </header>

    <section class="hero">
      <div>
        <div class="eyebrow">WORKSHEET MAKER</div>
        <h1>100ます計算プリント</h1>
        <p>数字と計算の種類を選ぶだけ。必要な枚数をまとめて作れます。数字を入れ替えて、何度でも新しい問題を作成できます。</p>
      </div>
      <div class="hero-stamp">無料 · 登録不要 · すぐ印刷</div>
    </section>

    <main class="workspace">
      <aside class="panel" aria-labelledby="settingsTitle">
        <h2 id="settingsTitle">プリントの設定</h2>
        <div class="settings-grid">
          <div class="field">
            <span class="field-label">計算の種類</span>
            <div class="seg" id="operation" role="group" aria-label="計算の種類">
              <button type="button" data-op="add" class="active" aria-pressed="true">たし算</button>
              <button type="button" data-op="subtract" aria-pressed="false">ひき算</button>
              <button type="button" data-op="multiply" aria-pressed="false">かけ算</button>
            </div>
          </div>
          <fieldset class="field theme-field">
            <legend class="field-label">プリントの色</legend>
            <div class="theme-options" role="radiogroup" aria-label="プリントの色">
              <label class="theme-choice">
                <input type="radio" name="theme" value="green" aria-label="緑" checked>
                <span class="theme-swatch theme-swatch-green" aria-hidden="true"></span>
              </label>
              <label class="theme-choice">
                <input type="radio" name="theme" value="blue" aria-label="水色">
                <span class="theme-swatch theme-swatch-blue" aria-hidden="true"></span>
              </label>
              <label class="theme-choice">
                <input type="radio" name="theme" value="yellow" aria-label="黄色">
                <span class="theme-swatch theme-swatch-yellow" aria-hidden="true"></span>
              </label>
              <label class="theme-choice">
                <input type="radio" name="theme" value="pink" aria-label="ピンク">
                <span class="theme-swatch theme-swatch-pink" aria-hidden="true"></span>
              </label>
            </div>
          </fieldset>
          <div class="field">
            <label for="range">数字の範囲</label>
            <div class="select-wrap">
              <select id="range">
                <option value="9" selected>0 〜 9</option>
                <option value="10">0 〜 10</option>
                <option value="12">0 〜 12</option>
                <option value="20">0 〜 20</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="gridSize">表の大きさ</label>
            <div class="select-wrap">
              <select id="gridSize">
                <option value="5">5 × 5ます</option>
                <option value="10" selected>10 × 10ます</option>
                <option value="15">15 × 15ます</option>
                <option value="20">20 × 20ます</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="difficulty">出題の並び</label>
            <div class="select-wrap">
              <select id="difficulty">
                <option value="random" selected>ランダム</option>
                <option value="ascending">小さい順</option>
                <option value="descending">大きい順</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="copies">つくる枚数</label>
            <div class="select-wrap">
              <select id="copies">
                <option value="1" selected>1枚</option>
                <option value="3">3枚</option>
                <option value="5">5枚</option>
                <option value="10">10枚</option>
                <option value="20">20枚</option>
                <option value="30">30枚</option>
                <option value="50">50枚</option>
              </select>
            </div>
          </div>
        </div>

        <div class="divider"></div>
        <div class="toggle-line">
          <span id="answerToggleLabel">答えもつくる</span>
          <button class="switch" id="answerToggle" type="button" role="switch" aria-checked="false" aria-labelledby="answerToggleLabel"></button>
        </div>
        <div class="divider"></div>
        <button class="generate" id="generate" type="button">新しい問題をつくる　↗</button>
      </aside>

      <section class="stage" aria-label="プリントプレビュー">
        <div class="stage-head">
          <div class="stage-title">プレビュー <span id="stageCount">1枚 · 10×10ます</span></div>
          <div class="actions">
            <button class="btn primary" id="printBtn" type="button">印刷する ↗</button>
          </div>
        </div>
        <div id="sheets"></div>
        <template id="sheetTemplate">
          <article class="sheet">
            <header class="sheet-top">
              <h2 class="sheet-title"></h2>
              <div class="name-entry">なまえ<span class="name-blank"></span></div>
            </header>
            <div class="worksheet-layout">
              <div class="grid-wrap">
                <div class="math-grid" aria-label="計算問題"></div>
              </div>
              <aside class="worksheet-meta" aria-label="記入欄">
                <div class="meta-field"><span class="date-blank"></span>月<span class="date-blank"></span>日</div>
                <div class="meta-field"><span class="time-blank"></span>分<span class="time-blank"></span>秒</div>
                <div class="meta-field"><span class="score-blank"></span>点</div>
              </aside>
            </div>
          </article>
        </template>
        <p class="footer-note">A4横向きで印刷するときれいに出力できます</p>
      </section>
    </main>
  </div>
</body>
</html>
